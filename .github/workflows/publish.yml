name: Publish Extension

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          # Baked into the bundle at package time by webpack.config.js's DefinePlugin — see
          # src/api-client.ts. Set this repo secret so published .vsix builds know where to
          # send logs without students configuring anything.
          COGNITRACE_API_URL: ${{ secrets.COGNITRACE_API_URL }}

